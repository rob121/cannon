name: Release Cannon

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional override (e.g. v0.1.3). Leave empty to use ReleaseVersion from internal/version.'
        required: false
        type: string
        default: ''
      notes:
        description: 'Optional release notes body. Leave empty to use generated notes only.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

env:
  APP_NAME: cannon

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          v=""
          if [ -n "${INPUT_VERSION:-}" ]; then
            v="$INPUT_VERSION"
          elif [[ "$REF" == refs/tags/v* ]]; then
            v="$REF_NAME"
          else
            v="$(sed -nE 's/^[[:space:]]*const[[:space:]]+ReleaseVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' internal/version/version.go | head -n1)"
            if [ -z "$v" ]; then
              v="$(sed -nE 's/^[[:space:]]*ReleaseVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' internal/version/version.go | head -n1)"
            fi
          fi
          if [ -z "$v" ]; then
            echo "Could not resolve release version (set workflow input, push a v* tag, or define ReleaseVersion in internal/version/version.go)" >&2
            exit 1
          fi
          case "$v" in
            v*) ;;
            *) v="v${v}" ;;
          esac
          echo "Resolved VERSION=$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test -count=1 ./...

      - name: Build binary
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          platform="$(go env GOOS)_$(go env GOARCH)"
          asset="${APP_NAME}-${platform}"
          go build -trimpath \
            -ldflags="-s -w -X github.com/rob121/cannon/internal/version.Version=${VERSION} -X github.com/rob121/cannon/internal/version.Commit=${GITHUB_SHA}" \
            -o "dist/${asset}" ./cmd/cannon
          cd dist
          shasum -a 256 "${asset}" | awk '{print $1}' > "${asset}.sha256"
          echo "platform=${platform}" >> "$GITHUB_OUTPUT"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cannon-${{ steps.build.outputs.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release manifest
    runs-on: ubuntu-latest
    needs: [version, build]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          find dist -maxdepth 3 -type f -print -exec cp {} upload/ \;

      - name: Author cannon.json
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const appName = process.env.APP_NAME;
          const version = process.env.VERSION;
          const repo = process.env.GITHUB_REPOSITORY;
          const uploadDir = 'upload';
          const assets = {};

          for (const file of fs.readdirSync(uploadDir).sort()) {
            if (file.endsWith('.sha256')) continue;
            if (!file.startsWith(`${appName}-`)) continue;
            const platform = file.slice(appName.length + 1);
            const shaPath = path.join(uploadDir, `${file}.sha256`);
            const sha256 = fs.existsSync(shaPath) ? fs.readFileSync(shaPath, 'utf8').trim() : '';
            assets[platform] = {
              url: `https://github.com/${repo}/releases/download/${version}/${file}`,
              sha256
            };
          }

          const manifest = {
            name: appName,
            version,
            assets
          };
          fs.writeFileSync(path.join(uploadDir, 'cannon.json'), `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          cat upload/cannon.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          # Allow patch rebuilds under the same semver (assets replaced in place).
          overwrite_files: true
          body: ${{ github.event.inputs.notes }}
          generate_release_notes: true
          files: upload/*
