<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .Title}}{{.Title}}{{else}}Error{{end}}{{if .ErrorCode}} · {{.ErrorCode}}{{end}}</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #526070;
      --paper: #f6f7f9;
      --card: #ffffff;
      --line: #d9dee8;
      --accent: #243e32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.55 system-ui, -apple-system, Segoe UI, sans-serif;
    }
    main {
      width: min(28rem, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      padding: 2rem 1.75rem;
      text-align: center;
    }
    .code {
      display: inline-block;
      margin-bottom: 0.75rem;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.5rem;
      line-height: 1.25;
    }
    p {
      margin: 0 0 1.5rem;
      color: var(--muted);
    }
    a {
      display: inline-block;
      text-decoration: none;
      color: #fff;
      background: var(--accent);
      border-radius: 0.5rem;
      padding: 0.7rem 1.1rem;
      font-weight: 600;
    }
    a:hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <main>
    {{if .ErrorCode}}<div class="code">{{.ErrorCode}}</div>{{end}}
    <h1>{{if .Title}}{{.Title}}{{else}}Error{{end}}</h1>
    <p>{{if .ErrorMessage}}{{.ErrorMessage}}{{else}}An error occurred.{{end}}</p>
    <a href="{{if .HomeURL}}{{.HomeURL}}{{else}}/{{end}}">Return Home</a>
  </main>
</body>
</html>
